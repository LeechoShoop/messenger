[package]
name = "messenger-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
# ── Primus workspace crates ────────────────────────────────────────────────────
messenger      = { path = "../messenger" }
messenger-core = { path = "../messenger-core" }

# ── Terminal UI ────────────────────────────────────────────────────────────────
ratatui   = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

# ── Async runtime (shared across workspace) ───────────────────────────────────
tokio = { version = "1", features = ["full"] }

# ── Crypto / TLS (same constraints as cli.rs) ─────────────────────────────────
rustls = { version = "0.23", features = ["ring"] }
quinn  = "0.11"

# ── Utilities ─────────────────────────────────────────────────────────────────
anyhow       = "1.0"
async-trait  = "0.1"
log          = "0.4"
env_logger   = "0.11"
hex          = "0.4"
bincode      = "1.3.3"
serde        = { version = "1.0", features = ["derive"] }
serde_json   = "1.0"
dashmap      = "6.1"
sha3         = "0.10"
