[package]
name = "messenger-core"
version = "0.1.0"
edition = "2024"

[dependencies]
# GAP: path assumes messenger-core sits alongside primus-net-opt as a sibling
# workspace member (primus-net-opt/Cargo.toml's `[package] name = "messenger"`
# is the crate name — "primus-net-opt" is just the directory/repo name).
# Adjust the path if the actual workspace layout differs.
messenger = { path = "../messenger" }

# REQUIRED CHANGE (this prompt): added the "time" feature. Previously only
# "sync" was enabled, which was enough for the mpsc channel in outbound.rs
# but not for pending_outbox.rs's `tokio::time::interval` (the retry
# loop's 30s tick) — without "time", `tokio::time::interval` doesn't exist
# and this won't compile (E0433/unresolved module).
tokio = { version = "1", features = ["sync", "time"] }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3.3"
anyhow = "1.0"
async-trait = "0.1.89"
log = "0.4.29"
sha3 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tokio-test = "0.4"
# Integration tests: keygen + real network stack
rand = "0.8"
ml-dsa = { version = "0.0.4", default-features = false, features = ["rand_core"] }
rustls = "0.23"
quinn = "0.11"