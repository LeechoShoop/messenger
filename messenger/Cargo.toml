[package]
name = "messenger"
version = "0.1.0"
edition = "2024"

[dependencies]
quinn = "0.11"
tokio = { version = "1", features = ["full"] }
sha3 = "0.10"
bytes = "1.9"
serde = { version = "1.0", features = ["derive"] }
dashmap = "6.1"
anyhow = "1.0"
futures = "0.3"
rand = "0.8"
snow = "0.9"
ml-dsa = { version = "0.0.4", default-features = false, features = ["rand_core"] }
wtransport = "0.1"
bincode = "1.3.3"
log = "0.4.29"
env_logger = "0.11"
rustls = { version = "0.23.39", features = ["ring"] }
rcgen = "0.13.2"
async-trait = "0.1.89"
local-ip-address = "0.6.12"
igd-next = { version = "0.17.0", features = ["aio_tokio"] }
socket2 = "0.6.3"
tokio-util = { version = "0.7", features = ["codec"] }
hex = "0.4"

# NEW (this prompt) — identity.rs's platform config directory resolution
# (identity.key / identity.pk8 / dht_snapshot.bin all live under here).
dirs = "5.0"

# NEW (this prompt) — identity.rs's optional passphrase-encrypted keypair
# storage (scrypt + AES-256-CBC via PBES2), gated behind the
# `encrypted-identity` feature below so the default build doesn't pull in
# an API surface this session couldn't compile-check (see identity.rs's
# `encrypted` submodule doc comment for the honest gap on that path).
pkcs8 = { version = "0.10", features = ["encryption", "pkcs5", "alloc"], optional = true }

[features]
# Off by default — see the `pkcs8` dependency comment above and
# identity.rs's module doc comment for the plain-vs-encrypted tradeoff.
encrypted-identity = ["dep:pkcs8"]

# ── Binary targets ────────────────────────────────────────────────────────────

[[bin]]
# The existing network-layer daemon entry point (no REPL, runs forever).
name = "messenger"
path = "src/main.rs"

[[bin]]
# Minimal debug / demo CLI: whoami | peers | send <node_id> <msg>
# See src/bin/cli.rs for the full description and design notes.
name = "messenger-cli"
path = "src/bin/cli.rs"

[dev-dependencies]
proptest          = "1.4"
tokio-test        = "0.4"
criterion         = { version = "0.5", features = ["html_reports"] }
mockall           = "0.12"
tempfile          = "3"
async-trait       = "0.1"
